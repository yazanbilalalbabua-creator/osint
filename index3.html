<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="عرض تقديمي تفاعلي احترافي حول تحليل المصادر المفتوحة OSINT مع وضع التقديم، الانتقالات السينمائية، ملاحظات المحاضر، ووضع مقدم العرض.">

    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 RTL CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">

    <!-- Font Awesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Babel Standalone CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* ==========================================================================
           OSINT Keynote & PowerPoint-Style Presentation Engine Styles
           ========================================================================== */
        :root {
            --osint-bg-dark: #050811;
            --osint-bg-navy: #0a1124;
            --osint-electric: #00d2ff;
            --osint-blue: #3b82f6;
            --osint-purple: #8b5cf6;
            --osint-green: #10b981;
            --osint-amber: #f59e0b;
            --osint-rose: #f43f5e;
            --osint-glass: rgba(13, 20, 40, 0.76);
            --osint-glass-strong: rgba(15, 23, 48, 0.92);
            --osint-border: rgba(0, 210, 255, 0.24);
            --osint-text: #f8fafc;
            --osint-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--osint-bg-dark);
            color: var(--osint-text);
            overflow: hidden;
            user-select: none;
        }

        /* Stage & Parallax Background */
        .presentation-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 20%, rgba(0, 210, 255, 0.14), transparent 44%),
                radial-gradient(circle at 82% 78%, rgba(139, 92, 246, 0.16), transparent 46%),
                linear-gradient(160deg, #040711 0%, #091024 55%, #050811 100%);
            display: flex;
            flex-direction: column;
            perspective: 1400px;
        }

        .tech-grid-overlay {
            position: absolute;
            inset: -24px;
            background-image:
                linear-gradient(to right, rgba(0, 210, 255, 0.055) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 210, 255, 0.055) 1px, transparent 1px);
            background-size: 46px 46px;
            pointer-events: none;
            z-index: 0;
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ambient-glow-layer {
            position: absolute;
            inset: -30px;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 25% 30%, rgba(0, 210, 255, 0.09), transparent 38%),
                radial-gradient(circle at 75% 70%, rgba(139, 92, 246, 0.11), transparent 40%);
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Presentation Mode vs Overview Stage */
        .presentation-mode-active .slide-viewport {
            padding: 1.25rem 2.25rem 5.25rem;
        }

        .presentation-mode-active .slide-canvas {
            max-width: 1380px;
            min-height: calc(100vh - 6.8rem);
        }

        .presentation-mode-active .slide-title-main {
            font-size: clamp(1.95rem, 3.2vw, 2.95rem) !important;
        }

        .presentation-mode-active .glass-card {
            border-color: rgba(0, 210, 255, 0.36);
            background: rgba(12, 19, 38, 0.88);
        }

        /* Top Progress Bar */
        .top-progress-wrap {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            z-index: 1060;
        }

        .top-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--osint-electric), var(--osint-purple), var(--osint-green));
            transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.75);
        }

        /* Top Start Presentation Bar (when not in Presentation Mode) */
        .top-launcher-bar {
            position: fixed;
            top: 10px;
            left: 16px;
            right: 16px;
            z-index: 1045;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .top-launcher-bar > * {
            pointer-events: auto;
        }

        /* Slide Viewport Container */
        .slide-viewport {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 3.4rem 2rem 5.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-canvas {
            width: 100%;
            max-width: 1320px;
            min-height: calc(100vh - 8.5rem);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* ==========================================================================
           Cinematic Slide Transitions (7 Modes)
           ========================================================================== */
        .trans-fade {
            animation: cineFade 0.52s ease forwards;
        }
        @keyframes cineFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .trans-slide {
            animation: cineSlideDir 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cineSlideDir {
            from {
                opacity: 0;
                transform: translateX(var(--slide-enter-x, -55px));
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .trans-zoom {
            animation: cineZoom 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cineZoom {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .trans-cinematic {
            animation: cineReveal 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cineReveal {
            0% {
                opacity: 0;
                transform: translateY(22px) scale(0.97);
                filter: brightness(1.45);
            }
            65% {
                filter: brightness(1.1);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
        }

        .trans-flip {
            animation: cineFlip3D 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cineFlip3D {
            from {
                opacity: 0;
                transform: rotateY(var(--flip-angle, 14deg)) scale(0.96);
            }
            to {
                opacity: 1;
                transform: rotateY(0deg) scale(1);
            }
        }

        .trans-parallax {
            animation: cineParallaxSlide 0.56s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cineParallaxSlide {
            from {
                opacity: 0;
                transform: translateX(var(--slide-enter-x, -42px)) translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateY(0);
            }
        }

        .trans-blur {
            animation: cineBlur 0.52s ease forwards;
        }
        @keyframes cineBlur {
            from {
                opacity: 0;
                filter: blur(10px);
                transform: scale(0.99);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        /* ==========================================================================
           Progressive Element Reveal Inside Each Slide (Fade In, Slide Up, Scale In)
           ========================================================================== */
        .reveal-item {
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal-hidden {
            opacity: 0;
            transform: translateY(18px) scale(0.97);
            pointer-events: none;
        }

        .reveal-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .reveal-scale-visible {
            opacity: 1;
            transform: scale(1);
        }

        .reveal-scale-hidden {
            opacity: 0;
            transform: scale(0.92);
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--osint-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--osint-border);
            border-radius: 20px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.38);
            transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 210, 255, 0.52);
            box-shadow: 0 18px 40px rgba(0, 210, 255, 0.14);
        }

        .text-electric {
            color: var(--osint-electric) !important;
        }

        .text-purple-glow {
            color: #a78bfa !important;
        }

        .text-green-tech {
            color: var(--osint-green) !important;
        }

        .gradient-heading {
            background: linear-gradient(135deg, #ffffff 10%, var(--osint-electric) 55%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge-osint {
            background: rgba(0, 210, 255, 0.14);
            color: var(--osint-electric);
            border: 1px solid rgba(0, 210, 255, 0.35);
            font-weight: 700;
            padding: 0.36rem 0.9rem;
            border-radius: 50px;
            font-size: 0.84rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .badge-purple {
            background: rgba(139, 92, 246, 0.16);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-weight: 700;
            padding: 0.34rem 0.85rem;
            border-radius: 50px;
            font-size: 0.82rem;
        }

        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            font-weight: 700;
            padding: 0.34rem 0.85rem;
            border-radius: 50px;
            font-size: 0.82rem;
        }

        .slide-header-row {
            margin-bottom: 1.25rem;
        }

        .slide-title-main {
            font-weight: 900;
            font-size: clamp(1.7rem, 2.75vw, 2.5rem);
            margin: 0.4rem 0 0.2rem;
            line-height: 1.25;
        }

        .slide-subtitle-lead {
            color: var(--osint-muted);
            font-size: 1.02rem;
            margin: 0;
        }

        /* Methodology Pipeline */
        .pipeline-step {
            position: relative;
            padding: 1.05rem;
            border-radius: 18px;
            background: var(--osint-glass-strong);
            border: 1px solid rgba(0, 210, 255, 0.28);
            height: 100%;
            transition: all 0.3s ease;
        }

        .pipeline-step.revealed {
            border-color: var(--osint-electric);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.18);
        }

        .step-num-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--osint-electric), var(--osint-purple));
            color: #050811;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.98rem;
            flex-shrink: 0;
        }

        /* ==========================================================================
           Auto-Hiding Control Dock
           ========================================================================== */
        .control-dock {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            z-index: 1050;
            background: rgba(8, 13, 28, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 210, 255, 0.34);
            border-radius: 999px;
            padding: 0.42rem 0.85rem;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            max-width: 97vw;
            overflow-x: auto;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .control-dock.dock-hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(28px);
            pointer-events: none;
        }

        .dock-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--osint-text);
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .dock-btn:hover:not(:disabled) {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--osint-electric);
            color: #ffffff;
        }

        .dock-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .dock-btn.active-mode {
            background: linear-gradient(135deg, var(--osint-electric), var(--osint-purple));
            color: #050811;
            border-color: transparent;
        }

        .slide-counter-pill {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.38);
            color: var(--osint-electric);
            padding: 0.32rem 0.8rem;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        /* Drawer & Speaker Notes Panel & Presenter View Modal */
        .slide-drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 5, 14, 0.75);
            backdrop-filter: blur(6px);
            z-index: 1070;
            display: flex;
            justify-content: flex-start;
        }

        .slide-drawer-panel {
            width: 350px;
            max-width: 90vw;
            height: 100%;
            background: #080e1f;
            border-left: 1px solid rgba(0, 210, 255, 0.3);
            padding: 1.25rem;
            overflow-y: auto;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.7);
        }

        .drawer-slide-item {
            padding: 0.7rem 0.85rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.5rem;
        }

        .drawer-slide-item:hover {
            border-color: var(--osint-electric);
            background: rgba(0, 210, 255, 0.08);
        }

        .drawer-slide-item.current {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(139, 92, 246, 0.2));
            border-color: var(--osint-electric);
        }

        .speaker-notes-panel {
            position: fixed;
            bottom: 74px;
            left: 16px;
            width: 440px;
            max-width: calc(100vw - 32px);
            max-height: 68vh;
            overflow-y: auto;
            z-index: 1065;
            background: rgba(7, 12, 26, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 20px;
            padding: 1.25rem;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
        }

        .presenter-view-overlay {
            position: fixed;
            inset: 0;
            z-index: 1080;
            background: #040711;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .pulse-node {
            animation: pulseRing 2.8s infinite;
        }

        @keyframes pulseRing {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 768px) {
            .slide-viewport {
                padding: 3.4rem 0.9rem 5.2rem;
                align-items: flex-start;
            }
            .slide-canvas {
                min-height: auto;
            }
            .dock-btn span.btn-label {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TOTAL_SLIDES = 12;

        const TRANSITION_MODES = [
            { id: 'cinematic', label: 'Cinematic Reveal (إضاءة وظهور سينمائي)' },
            { id: 'fade', label: 'Fade Transition (ظهور واختفاء ناعم)' },
            { id: 'slide', label: 'Slide Transition (انتقال انسيابي أفقي)' },
            { id: 'zoom', label: 'Zoom Transition (تكبير وتصغير خفيف)' },

        ];

        const SLIDE_INDEX_TITLES = [
            { num: 1, title: 'العنوان الرئيسي: OSINT', tag: 'المقدمة' },
            { num: 2, title: 'ما هو تحليل المصادر المفتوحة؟', tag: 'المفهوم' },
            { num: 3, title: 'منهجية البحث والتحليل (5 مراحل)', tag: 'المنهجية' },
            { num: 4, title: 'أقسام OSINT الرئيسية', tag: 'التخصصات' },
            { num: 5, title: 'التحليل التقني والأمن السيبراني', tag: 'Cyber OSINT' },
            { num: 6, title: 'التحقق الجغرافي والبصري', tag: 'Geolocation' },
            { num: 7, title: 'أبحاث السوق والبيانات التجارية', tag: 'Business OSINT' },
            { num: 8, title: 'تحليل منصات التواصل الاجتماعي', tag: 'Social Media' },
            { num: 9, title: 'تتبع البصمة الرقمية', tag: 'Digital Footprint' },
            { num: 10, title: 'OSINT في الحياة اليومية', tag: 'التطبيقات' },
            { num: 11, title: 'الضوابط الأخلاقية والقانونية', tag: 'الحوكمة والأخلاق' },
            { num: 12, title: 'الخاتمة: المعرفة تبدأ من البيانات', tag: 'الخلاصة' }
        ];

        /* ==========================================================================
           Rich Speaker Notes for All 12 Slides (Arabic Eloquence & Practical Delivery)
           ========================================================================== */
        const SPEAKER_NOTES_DATA = {
            1: {
                slideTitle: 'تحليل المصادر المفتوحة (OSINT)',
                intro: 'أرحّب بكم جميعاً في هذه الجلسة العلمية والتقنية، حيث نناقش أحد أهم مسارات البحث والتحليل في عصر المعلومات وهو تحليل المصادر المفتوحة OSINT.',
                explanation: 'نركز اليوم على الإطار المنهجي والعلمي لهذا التخصص، وكيف تختلف المصادر المفتوحة عن جمع المعلومات العشوائي، مع استعراض أبرز أقسامه وتطبيقاته المدنية والمهنية.',
                example: 'في كثير من الحالات، تكون المعلومة المطلوبة متاحة بالفعل للعامة في تقارير أو خرائط أو سجلات مفتوحة، لكن التحدي الحقيقي يكمن في معرفة أين نبحث وكيف نربط الأدلة.',
                question: 'برأيكم، ما أكبر تحدٍ يواجه الباحث اليوم وسط هذا الكم الهائل من البيانات المتاحة للعلن؟',

            },
            2: {
                slideTitle: 'ما هو تحليل المصادر المفتوحة؟',
                intro: 'يظن البعض أن OSINT مجرد بحث سريع في الإنترنت، لكنه في الحقيقة منهجية منظمة تمر بالجمع والتصفية والتحليل وفق ضوابط قانونية واضحة.',
                explanation: 'جوهر العمل هنا هو تقليل الضوضاء الرقمية الهائلة واستخراج إشارات ذات معنى؛ والمصادر المفتوحة تشمل المصادر المجانية مثل محركات البحث وكذلك المصادر المدفوعة المشروعة مثل قواعد البيانات التجارية.',

        /* ==========================================================================
           Progressive Element Wrapper Component
           ========================================================================== */
        const RevealBlock = ({ visible, stepIndex, currentStep, children, className = '', scaleOnly = false }) => {
            const delayMs = Math.min(stepIndex * 65, 260);
            const stateClass = visible
                ? (scaleOnly ? 'reveal-scale-visible' : 'reveal-visible')
                : (scaleOnly ? 'reveal-scale-hidden' : 'reveal-hidden');

            return (
                <div
                    className={`reveal-item ${stateClass} ${className}`}
                    style={{ transitionDelay: visible ? `${delayMs}ms` : '0ms' }}
                >
                    {children}
                </div>
            );
        };

        /* ==========================================================================
           Reusable Chart.js Wrapper Component
           ========================================================================== */
        const OsintChart = ({ type, data, options, height = '225px' }) => {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !window.Chart) return;
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                chartInstanceRef.current = new window.Chart(ctx, {
                    type,
                    data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#e2e8f0',
                                    font: { family: 'Cairo', size: 12, weight: 'bold' }
                                }
                            },
                            tooltip: {
                                titleFont: { family: 'Cairo', size: 13 },
                                bodyFont: { family: 'Cairo', size: 12 }
                            }
                        },
                        ...options
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                    }
                };
            }, [type, data, options]);

            return (
                <div style={{ position: 'relative', height, width: '100%' }}>
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        };

                                            <div className="fw-black text-green-tech mb-1">
                                                <i className="fa-solid fa-crown me-2"></i>
                                                القاعدة الذهبية
                                            </div>
                                            <p className="mb-0 small lh-lg text-light">
                                                المصادر المفتوحة تعني المصادر العلنية والقانونية، سواء كانت <strong>مجانية</strong> مثل محركات البحث، أو <strong>مدفوعة</strong> مثل قواعد البيانات التجارية واشتراكات الأبحاث.

                        <div className="col-lg-5">
                            <RevealBlock visible={revealStep >= 4} stepIndex={3} currentStep={revealStep} className="h-100" scaleOnly>

                                        من الضوضاء والبيانات إلى المعرفة
                                    </h5>

                                    <div className="p-3 rounded-3 mb-2" style={{ background: 'rgba(244, 63, 94, 0.12)', border: '1px solid rgba(244, 63, 94, 0.35)' }}>

                                    </div>

                                    <div className="text-center text-electric my-1">
                                        <i className="fa-solid fa-angles-down fs-5"></i>
                                    </div>

                                    <div className="p-3 rounded-3 mb-2" style={{ background: 'rgba(59, 130, 246, 0.14)', border: '1px solid rgba(59, 130, 246, 0.4)' }}>
                                        <div className="fw-bold small text-info"><i className="fa-solid fa-magnifying-glass-chart me-1"></i> 2. التصفية والتحقق (Filtering &amp; Verification)</div>

                                    </div>

                                    <div className="text-center text-green-tech my-1">
                                        <i className="fa-solid fa-angles-down fs-5"></i>
                                    </div>

                                    <div className="p-3 rounded-3" style={{ background: 'rgba(16, 185, 129, 0.16)', border: '1px solid rgba(16, 185, 129, 0.45)' }}>

                    {showExample && (

                            بدلاً من قراءة آلاف التعليقات العشوائية حول خدمة ما، يجمع محلل OSINT البيانات العلنية ويصنفها ليكتشف أن 80% من الشكاوى تتركز في منطقة جغرافية أو نسخة برمجية محددة.

        /* ==========================================================================
           Slide 3: منهجية البحث والتحليل (5 مراحل)

                    num: 2,
                    title: 'الجمع Collection',
                    icon: 'fa-database',

                    desc: 'استخراج البيانات الأولية من المنصات الرقمية والسجلات المتاحة للعامة.',
                    examples: []
                },
                {
                    num: 3,
                    title: 'التصفية والتنظيم Processing',
                    icon: 'fa-layer-group',

                <div className="py-1">

            );
        };

        /* ==========================================================================
           Slide 4: الأقسام والتخصصات الرئيسية
           ========================================================================== */

                    accent: '#00d2ff',
                    brief: 'فحص الأصول الرقمية المكشوفة، النطاقات، والخدمات المتصلة بالإنترنت لتعزيز الدفاع السيبراني.',

                                            </div>
                                            <h6 className="fw-black mb-1">{d.ar}</h6>
                                            <div className="small fw-bold mb-2" style={{ color: d.accent }}>{d.en}</div>
                                            <p className="small text-muted-custom mb-0 lh-base">{d.brief}</p>
                                        </div>
                                        <div className="small text-electric mt-2 fw-bold">
                                            <i className="fa-solid fa-circle-plus me-1"></i> مثال عملي
                                        </div>
                                    </div>
                                </RevealBlock>
                            </div>
                        ))}
                    </div>

                    {activeDomain && (
                        <div className="glass-card p-3 mt-3 border-info animate__animated animate__fadeIn">

        /* ==========================================================================
           Slide 5: التحليل التقني والأمن السيبراني (Cyber OSINT)
           ========================================================================== */

        };

        const SpeakerNotesPanel = ({ isOpen, onClose, currentSlide }) => {

        const PresenterViewOverlay = ({

            const formatElapsed = (sec) => {
                const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
                const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');

                            <div className="small fw-bold text-electric">

                            <select

                            <button className="btn btn-sm btn-outline-danger rounded-pill px-3 fw-bold" onClick={onClose}>
                                <i className="fa-solid fa-xmark me-1"></i> إغلاق وضع المحاضر
                            </button>
                        </div>
                    </div>

                    {/* Main Presenter Grid */}
                    <div className="row g-3">
                        {/* Left: Current Slide & Next Slide Preview */}
                        <div className="col-lg-7 d-flex flex-column gap-3">
                            <div className="glass-card p-3">
                                <div className="d-flex justify-content-between align-items-center mb-2">
                                    <span className="small fw-bold text-electric">
                                        <i className="fa-solid fa-desktop me-1"></i> الشريحة الحالية (رقم {currentSlide})
                                    </span>
                                    <div className="d-flex gap-2">
                                        <button className="btn btn-sm btn-outline-info" onClick={goPrev} disabled={currentSlide === 1}>

                            <div className="glass-card p-3">

                                            <strong className="text-light">{nextSlideMeta.title}</strong>

                                        <span className="small text-muted-custom">{nextSlideMeta.tag}</span>
                                    </div>

                                    <div className="small text-muted-custom">هذه هي الشريحة الأخيرة في العرض التقديمي.</div>
                                )}
                            </div>

                        {/* Right: Detailed Speaker Notes */}
                        <div className="col-lg-5">
                            <div className="glass-card p-4 h-100 overflow-auto" style={{ maxHeight: '535px' }}>
                                <h5 className="fw-black text-electric mb-3">
                                    <i className="fa-solid fa-book-open me-2"></i>
                                    ملاحظات المحاضر — {note.slideTitle}
                                </h5>

                                <div className="mb-3">
                                    <div className="small fw-bold text-info mb-1">مقدمة قصيرة يشرحها المحاضر:</div>
                                    <p className="small text-light opacity-90 mb-0 lh-lg">{note.intro}</p>
                                </div>

                                <div className="mb-3">
                                    <div className="small fw-bold text-purple-glow mb-1">شرح إضافي للنقاط الرئيسية:</div>
                                    <p className="small text-light opacity-90 mb-0 lh-lg">{note.explanation}</p>
                                </div>

                                <div className="mb-3">
                                    <div className="small fw-bold text-green-tech mb-1">مثال عملي أثناء العرض:</div>
                                    <p className="small text-light opacity-90 mb-0 lh-lg">{note.example}</p>
                                </div>

                                <div className="mb-3">
                                    <div className="small fw-bold text-warning mb-1">سؤال تفاعلي للجمهور:</div>
                                    <p className="small text-light opacity-90 mb-0 lh-lg">{note.question}</p>
                                </div>

                                <div className="p-3 rounded-3" style={{ background: 'rgba(0, 210, 255, 0.1)', border: '1px solid rgba(0, 210, 255, 0.3)' }}>
                                    <div className="small fw-bold text-electric mb-1">جملة انتقالية للشريحة التالية:</div>
                                    <div className="small text-light lh-lg">{note.transition}</div>
                                </div>

            );

        /* ==========================================================================
           Slide Index Drawer Component
           ========================================================================== */
        const SlideDrawer = ({ isOpen, onClose, currentSlide, onJumpToSlide }) => {
            if (!isOpen) return null;

            return (
                <div className="slide-drawer-backdrop" onClick={onClose}>
                    <div className="slide-drawer-panel" onClick={(e) => e.stopPropagation()}>
                        <div className="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary border-opacity-25">
                            <h5 className="fw-black mb-0 text-electric">
                                <i className="fa-solid fa-list-ol me-2"></i>
                                قائمة الشرائح ({TOTAL_SLIDES})
                            </h5>
                            <button className="btn btn-sm btn-outline-light rounded-circle" onClick={onClose} aria-label="إغلاق القائمة">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div>
                            {SLIDE_INDEX_TITLES.map((item) => {
                                const active = item.num === currentSlide;
                                return (
                                    <div
                                        key={item.num}
                                        className={`drawer-slide-item ${active ? 'current' : ''}`}
                                        onClick={() => {
                                            onJumpToSlide(item.num);
                                            onClose();
                                        }}
                                    >
                                        <div className="d-flex justify-content-between align-items-center mb-1">
                                            <span className="small fw-black text-electric">شريحة {item.num}</span>
                                            <span className="badge bg-dark text-light border border-secondary border-opacity-25 small">
                                                {item.tag}
                                            </span>
                                        </div>
                                        <div className="small fw-bold text-light">{item.title}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        /* ==========================================================================
           Main Presentation Engine Application
           ========================================================================== */
        const OsintPresentationApp = () => {
            const [currentSlide, setCurrentSlide] = useState(1);
            const [revealStep, setRevealStep] = useState(6);
            const [navDirection, setNavDirection] = useState('next'); // 'next' | 'prev'

            const [presentationMode, setPresentationMode] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [transitionMode, setTransitionMode] = useState('cinematic');

            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [isNotesOpen, setIsNotesOpen] = useState(false);
            const [isPresenterViewOpen, setIsPresenterViewOpen] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);

            const [dockVisible, setDockVisible] = useState(true);
            const [presenterName, setPresenterName] = useState('يزن بلال البعبوع');
            const [presentationDate, setPresentationDate] = useState('نوفمبر 2026');

            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const [nowClockStr, setNowClockStr] = useState('');

            const touchStartXRef = useRef(null);
            const hideDockTimerRef = useRef(null);

            // Live Digital Clock & Presentation Elapsed Timer
            useEffect(() => {
                const updateClock = () => {
                    const d = new Date();
                    setNowClockStr(d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                };
                updateClock();
                const clockInterval = setInterval(updateClock, 1000);
                return () => clearInterval(clockInterval);
            }, []);

            useEffect(() => {
                if (isPaused) return;
                const timerInterval = setInterval(() => {
                    setElapsedSeconds((s) => s + 1);
                }, 1000);
                return () => clearInterval(timerInterval);
            }, [isPaused]);

            // Auto-hide Control Dock on inactivity during Presentation Mode
            const triggerDockActivity = () => {
                setDockVisible(true);
                if (hideDockTimerRef.current) {
                    clearTimeout(hideDockTimerRef.current);
                }
                if (presentationMode) {
                    hideDockTimerRef.current = setTimeout(() => {
                        setDockVisible(false);
                    }, 3400);
                }
            };

            useEffect(() => {
                triggerDockActivity();
                return () => {
                    if (hideDockTimerRef.current) clearTimeout(hideDockTimerRef.current);
                };
            }, [presentationMode, currentSlide]);

            const startPresentationFromBeginning = () => {
                setNavDirection('next');
                setCurrentSlide(1);
                setRevealStep(1);
                setPresentationMode(true);
                setIsPaused(false);
                setDockVisible(true);
            };

            const endPresentationMode = () => {
                setPresentationMode(false);
                setIsPresenterViewOpen(false);
                setDockVisible(true);
            };

            const restartPresentation = () => {
                setNavDirection('prev');
                setCurrentSlide(1);
                setRevealStep(presentationMode ? 1 : 6);
                setElapsedSeconds(0);
                setIsPaused(false);
            };

            const goToSlide = (num, dir = 'next', startStepped = presentationMode) => {
                const clamped = Math.max(1, Math.min(TOTAL_SLIDES, num));
                setNavDirection(dir);
                setCurrentSlide(clamped);
                setRevealStep(startStepped ? 1 : 6);
            };

            // Advance progressive element inside current slide or move to next slide
            const advanceNext = () => {
                if (isPaused) return;
                if (presentationMode && revealStep < 6) {
                    setRevealStep((prev) => prev + 1);
                } else if (currentSlide < TOTAL_SLIDES) {
                    goToSlide(currentSlide + 1, 'next', presentationMode);
                }
            };

            // Step back progressive element or move to previous slide
            const stepPrev = () => {
                if (isPaused) return;
                if (presentationMode && revealStep > 1) {
                    setRevealStep((prev) => prev - 1);
                } else if (currentSlide > 1) {
                    goToSlide(currentSlide - 1, 'prev', false);
                }
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
                } else {
                    document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
                }
            };

            useEffect(() => {
                const onFsChange = () => setIsFullscreen(Boolean(document.fullscreenElement));
                document.addEventListener('fullscreenchange', onFsChange);
                return () => document.removeEventListener('fullscreenchange', onFsChange);
            }, []);

            // Keyboard Shortcuts (ArrowRight, ArrowLeft, Space, Enter, Home, End, F, N, Esc)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tag = e.target.tagName.toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                    triggerDockActivity();

                    switch (e.key) {
                        case 'ArrowRight':
                        case ' ':
                        case 'Enter':
                            e.preventDefault();
                            advanceNext();
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            stepPrev();
                            break;
                        case 'Home':
                            e.preventDefault();
                            goToSlide(1, 'prev', presentationMode);
                            break;
                        case 'End':
                            e.preventDefault();
                            goToSlide(TOTAL_SLIDES, 'next', false);
                            break;
                        case 'f':
                        case 'F':
                            e.preventDefault();
                            toggleFullscreen();
                            break;
                        case 'n':
                        case 'N':
                            e.preventDefault();
                            setIsNotesOpen((prev) => !prev);
                            break;
                        case 'Escape':
                            if (isPresenterViewOpen) {
                                setIsPresenterViewOpen(false);
                            } else if (isNotesOpen) {
                                setIsNotesOpen(false);
                            } else if (isDrawerOpen) {
                                setIsDrawerOpen(false);
                            } else if (presentationMode) {
                                endPresentationMode();
                            }
                            break;
                        default:
                            break;
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            });

            // Touch Swipe Support for Mobile & Tablets
            const handleTouchStart = (e) => {
                triggerDockActivity();
                if (e.touches && e.touches.length > 0) {
                    touchStartXRef.current = e.touches[0].clientX;
                }
            };

            const handleTouchEnd = (e) => {
                if (touchStartXRef.current === null || !e.changedTouches || e.changedTouches.length === 0) return;
                const diffX = e.changedTouches[0].clientX - touchStartXRef.current;
                if (Math.abs(diffX) > 55) {
                    if (diffX > 0) {
                        advanceNext();
                    } else {
                        stepPrev();
                    }
                }
                touchStartXRef.current = null;
            };

            const renderSlideContent = (slideNum, stepVal) => {
                switch (slideNum) {
                    case 1:
                        return (
                            <Slide1Title
                                revealStep={stepVal}
                                presenterName={presenterName}
                                setPresenterName={setPresenterName}
                                presentationDate={presentationDate}
                                setPresentationDate={setPresentationDate}
                            />
                        );
                    case 2:
                        return <Slide2Concept revealStep={stepVal} />;
                    case 3:
                        return <Slide3Methodology revealStep={stepVal} />;
                    case 4:
                        return <Slide4Domains revealStep={stepVal} />;
                    case 5:
                        return <Slide5CyberOsint revealStep={stepVal} />;
                    case 6:
                        return <Slide6GeoVerification revealStep={stepVal} />;
                    case 7:
                        return <Slide7BusinessOsint revealStep={stepVal} />;
                    case 8:
                        return <Slide8SocialOsint revealStep={stepVal} />;
                    case 9:
                        return <Slide9DigitalFootprint revealStep={stepVal} />;
                    case 10:
                        return <Slide10DailyLife revealStep={stepVal} />;
                    case 11:
                        return <Slide11EthicsLaw revealStep={stepVal} />;
                    case 12:
                        return <Slide12Conclusion revealStep={stepVal} presenterName={presenterName} />;
                    default:
                        return <Slide1Title revealStep={stepVal} presenterName={presenterName} setPresenterName={setPresenterName} presentationDate={presentationDate} setPresentationDate={setPresentationDate} />;
                }
            };

            const progressPercent = (currentSlide / TOTAL_SLIDES) * 100;
            const transitionClass = `trans-${transitionMode}`;

            const dynamicMotionStyle = {
                '--slide-enter-x': navDirection === 'next' ? '-55px' : '55px',
                '--flip-angle': navDirection === 'next' ? '14deg' : '-14deg'
            };

            const parallaxGridTransform = `translate3d(${(currentSlide - 6) * -6}px, ${(currentSlide % 3 - 1) * -4}px, 0)`;
            const parallaxGlowTransform = `translate3d(${(currentSlide - 6) * 10}px, ${(currentSlide % 4 - 1.5) * 6}px, 0)`;

            return (
                <div
                    className={`presentation-stage ${presentationMode ? 'presentation-mode-active' : ''}`}
                    onMouseMove={triggerDockActivity}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                >
                    {/* Parallax Technical Grid & Ambient Lighting */}
                    <div
                        className="tech-grid-overlay"
                        style={{ transform: transitionMode === 'parallax' ? parallaxGridTransform : 'none' }}
                    ></div>
                    <div
                        className="ambient-glow-layer"
                        style={{ transform: transitionMode === 'parallax' ? parallaxGlowTransform : 'none' }}
                    ></div>

                    {/* Top Presentation Progress Bar */}
                    <div className="top-progress-wrap" role="progressbar" aria-valuenow={currentSlide} aria-valuemin="1" aria-valuemax={TOTAL_SLIDES}>
                        <div className="top-progress-fill" style={{ width: `${progressPercent}%` }}></div>
                    </div>

                    {/* Top Launch & Transition Selector Bar (Hidden during Presentation Mode) */}
                    {!presentationMode && (
                        <div className="top-launcher-bar">
                            <button
                                className="btn btn-sm fw-black px-3 py-2 rounded-pill shadow"
                                style={{
                                    background: 'linear-gradient(135deg, #00d2ff, #8b5cf6)',
                                    color: '#050811',
                                    border: 'none'
                                }}
                                onClick={startPresentationFromBeginning}
                            >
                                <i className="fa-solid fa-play me-1"></i>
                                بدء العرض التقديمي
                            </button>

                            <div className="d-flex align-items-center gap-2">
                                <select
                                    className="form-select form-select-sm bg-dark text-light border-info border-opacity-40 rounded-pill px-3"
                                    style={{ width: 'auto' }}
                                    value={transitionMode}
                                    onChange={(e) => setTransitionMode(e.target.value)}
                                    aria-label="إعدادات نوع الانتقال بين الشرائح"
                                >
                                    {TRANSITION_MODES.map((m) => (
                                        <option key={m.id} value={m.id}>{m.label}</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                    )}

                    {/* Main Slide Viewport */}
                    <main className="slide-viewport">
                        <div
                            key={`${currentSlide}-${transitionMode}`}
                            className={`slide-canvas ${transitionClass}`}
                            style={dynamicMotionStyle}
                        >
                            {renderSlideContent(currentSlide, revealStep)}
                        </div>
                    </main>

                    {/* Pause Overlay Banner */}
                    {isPaused && (
                        <div
                            className="position-fixed top-50 start-50 translate-middle glass-card p-4 text-center"
                            style={{ zIndex: 1062, minWidth: '280px' }}
                        >
                            <i className="fa-solid fa-pause-circle fs-1 text-warning mb-2 d-block"></i>
                            <h5 className="fw-black mb-2">العرض متوقف مؤقتاً</h5>
                            <button className="btn btn-sm btn-info text-dark fw-bold rounded-pill px-4" onClick={() => setIsPaused(false)}>
                                استئناف العرض
                            </button>
                        </div>
                    )}

                    {/* Slide Index Drawer */}
                    <SlideDrawer
                        isOpen={isDrawerOpen}
                        onClose={() => setIsDrawerOpen(false)}
                        currentSlide={currentSlide}
                        onJumpToSlide={(num) => goToSlide(num, num >= currentSlide ? 'next' : 'prev', presentationMode)}
                    />

                    {/* Speaker Notes Panel (Private to Presenter) */}
                    <SpeakerNotesPanel
                        isOpen={isNotesOpen}
                        onClose={() => setIsNotesOpen(false)}
                        currentSlide={currentSlide}
                    />

                    {/* Presenter View Overlay */}
                    <PresenterViewOverlay
                        isOpen={isPresenterViewOpen}
                        onClose={() => setIsPresenterViewOpen(false)}
                        currentSlide={currentSlide}
                        goNext={advanceNext}
                        goPrev={stepPrev}
                        elapsedSeconds={elapsedSeconds}
                        nowClockStr={nowClockStr}
                        renderSlideContent={renderSlideContent}
                        transitionMode={transitionMode}
                        setTransitionMode={setTransitionMode}
                    />

                    {/* Bottom Control Dock (Auto-hides after inactivity during Presentation Mode) */}
                    <div
                        className={`control-dock ${!dockVisible ? 'dock-hidden' : ''}`}
                        role="toolbar"
                        aria-label="شريط التحكم بالعرض التقديمي"
                    >
                        <button
                            className="dock-btn"
                            onClick={stepPrev}
                            disabled={currentSlide === 1 && (!presentationMode || revealStep === 1)}
                            title="الشريحة / العنصر السابق (سهم اليسار)"
                        >
                            <i className="fa-solid fa-chevron-right"></i>
                            <span className="btn-label">السابق</span>
                        </button>

                        <span className="slide-counter-pill" title="رقم الشريحة الحالية">
                            {currentSlide} / {TOTAL_SLIDES}
                        </span>

                        <button
                            className="dock-btn"
                            onClick={advanceNext}
                            disabled={currentSlide === TOTAL_SLIDES && (!presentationMode || revealStep >= 6)}
                            title="العنصر / الشريحة التالية (سهم اليمين / Space / Enter)"
                        >
                            <span className="btn-label">التالي</span>
                            <i className="fa-solid fa-chevron-left"></i>
                        </button>

                        <button
                            className="dock-btn"
                            onClick={() => setIsDrawerOpen(true)}
                            title="قائمة الشرائح"
                        >
                            <i className="fa-solid fa-list-ol"></i>
                            <span className="btn-label">الشرائح</span>
                        </button>

                        <button
                            className={`dock-btn ${isNotesOpen ? 'active-mode' : ''}`}
                            onClick={() => setIsNotesOpen(!isNotesOpen)}
                            title="ملاحظات المحاضر (N)"
                        >
                            <i className="fa-solid fa-note-sticky"></i>
                            <span className="btn-label">ملاحظات المحاضر</span>
                        </button>

                        <button
                            className={`dock-btn ${isPresenterViewOpen ? 'active-mode' : ''}`}
                            onClick={() => setIsPresenterViewOpen(!isPresenterViewOpen)}
                            title="وضع مقدم العرض Presenter View"
                        >
                            <i className="fa-solid fa-chalkboard-user"></i>
                            <span className="btn-label">Presenter View</span>
                        </button>

                        <button
                            className={`dock-btn ${isPaused ? 'active-mode' : ''}`}
                            onClick={() => setIsPaused(!isPaused)}
                            title="إيقاف العرض مؤقتاً / استئناف"
                        >
                            <i className={`fa-solid ${isPaused ? 'fa-play' : 'fa-pause'}`}></i>
                            <span className="btn-label">{isPaused ? 'استئناف' : 'إيقاف مؤقت'}</span>
                        </button>

                        <button
                            className="dock-btn"
                            onClick={restartPresentation}
                            title="إعادة العرض من البداية (Home)"
                        >
                            <i className="fa-solid fa-rotate-left"></i>
                            <span className="btn-label">إعادة العرض</span>
                        </button>

                        <button
                            className={`dock-btn ${isFullscreen ? 'active-mode' : ''}`}
                            onClick={toggleFullscreen}
                            title="ملء الشاشة Fullscreen (F)"
                        >
                            <i className={`fa-solid ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                            <span className="btn-label">ملء الشاشة</span>
                        </button>

                        {presentationMode ? (
                            <button
                                className="dock-btn"
                                style={{ borderColor: 'rgba(244, 63, 94, 0.55)', color: '#fda4af' }}
                                onClick={endPresentationMode}
                                title="إنهاء وضع التقديم (Esc)"
                            >
                                <i className="fa-solid fa-circle-stop"></i>
                                <span className="btn-label">إنهاء العرض</span>
                            </button>
                        ) : (
                            <button
                                className="dock-btn active-mode"
                                onClick={startPresentationFromBeginning}
                                title="بدء العرض التقديمي من الشريحة الأولى"
                            >
                                <i className="fa-solid fa-play"></i>
                                <span className="btn-label">بدء العرض التقديمي</span>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OsintPresentationApp />);
    </script>
</body>
</html>
